<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernhill</title>
<style>
  :root {
    --paper:#EEF1F0; --surface:#fff; --ink:#101A1F; --muted:#55666B; --line:#D3DBDA;
    --voice:#0B6E63; --voice-soft:#DDEFEC; --caller:#B5362C; --hold:#8A5808; --hold-soft:#F6EBD3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper:#0E1517; --surface:#162125; --ink:#E6EEEC; --muted:#9AABAC; --line:#29383C;
      --voice:#4CC4B0; --voice-soft:#12332F; --caller:#F08478; --hold:#E0A84A; --hold-soft:#33280F;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:16px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 56px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding:18px 0;border-bottom:1px solid var(--line)}
  .brand{font-weight:700;font-size:19px;letter-spacing:-0.01em}
  .mode{font-size:12px;color:var(--muted)}
  h1{font-size:21px;margin:22px 0 4px;letter-spacing:-0.01em}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 5px}
  select,input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--surface);color:var(--ink);font:inherit}
  textarea{resize:vertical;min-height:62px}
  button{font:inherit;font-weight:600;border-radius:999px;padding:10px 18px;cursor:pointer;
    border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
  button.ghost{background:transparent;color:var(--ink)}
  button:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:18px}
  .amount{font-size:30px;font-weight:700;letter-spacing:-0.02em;margin:2px 0 2px}
  .payee{color:var(--muted);font-size:14px}
  .callbar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--caller);
    border:1px solid var(--caller);border-radius:999px;padding:5px 12px;margin-top:12px;width:fit-content}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--caller)}
  .thread{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .msg{padding:10px 13px;border-radius:14px;font-size:15px;max-width:92%}
  .msg.app{background:var(--voice-soft);border-radius:14px 14px 14px 4px}
  .msg.me{align-self:flex-end;border:1px solid var(--line);border-radius:14px 14px 4px 14px}
  .msg small{display:block;font-size:11px;letter-spacing:.04em;color:var(--muted);margin-bottom:3px}
  .result{border:1px solid var(--voice);background:var(--voice-soft);border-radius:12px;padding:12px 14px;margin-top:16px}
  .result b{display:block;font-size:17px;margin-bottom:4px}
  .audit{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);
    border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;white-space:pre-wrap}
  .thinking{color:var(--muted);font-size:14px;margin-top:14px}
  footer{margin-top:28px;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">Fernhill</span>
    <span class="mode" id="mode">loading</span>
  </header>

  <h1>Confirm your payment</h1>
  <p class="sub">Fernhill is a fictional bank. Everything here runs the real Second Voice engine.</p>

  <div id="setup">
    <label for="scenario">Who are you today?</label>
    <select id="scenario"></select>
    <div class="row">
      <button id="begin">Review payment</button>
    </div>
  </div>

  <div id="payment" hidden>
    <div class="card">
      <div class="payee" id="payerLine"></div>
      <div class="amount" id="amountLine"></div>
      <div class="payee" id="payeeLine"></div>
      <div class="callbar" id="callbar" hidden><span class="dot"></span><span id="callText"></span></div>
    </div>

    <div class="thread" id="thread"></div>
    <p class="thinking" id="thinking" hidden>Second Voice is thinking…</p>

    <div id="composer" hidden>
      <label for="answer">Your answer</label>
      <textarea id="answer" placeholder="Type your reply"></textarea>
      <div class="row">
        <button id="send">Send</button>
        <button id="cancel" class="ghost">Cancel this payment</button>
      </div>
    </div>

    <div id="outcome"></div>
  </div>

  <footer>
    Second Voice 0.1. The payment never moves: there is no bank behind this page.
  </footer>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
let sessionId = null;
let meta = null;

const money = (n, c) =>
  new Intl.NumberFormat("en-GB", { style: "currency", currency: c, maximumFractionDigits: 0 }).format(n);

async function post(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error((await res.json()).error ?? res.statusText);
  return res.json();
}

function bubble(cls, who, text) {
  const p = document.createElement("div");
  p.className = `msg ${cls}`;
  const s = document.createElement("small");
  s.textContent = who;
  p.append(s, document.createTextNode(text));
  $("thread").append(p);
  p.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function busy(on) {
  $("thinking").hidden = !on;
  $("send").disabled = on;
  $("cancel").disabled = on;
}

function finish(file) {
  $("composer").hidden = true;
  const decision = file.outcome.decision.replace(/_/g, " ");
  const headline = {
    release: "Payment sent.",
    delay: "Payment delayed.",
    hold_for_review: "Payment held for review.",
    cancelled_by_payer: "Payment cancelled. Nothing has left your account.",
  }[file.outcome.decision] ?? decision;

  const box = document.createElement("div");
  box.className = "result";
  const b = document.createElement("b");
  b.textContent = headline;
  const audit = document.createElement("div");
  audit.className = "audit";
  audit.textContent =
    `rule ${file.outcome.ruleId}: ${file.outcome.ruleText}\n` +
    (file.outcome.caseNote ? `case note: ${file.outcome.caseNote}` : "");
  box.append(b, audit);
  $("outcome").append(box);
}

async function handle(step) {
  if (step.kind === "done") finish(step.file);
  else if (step.kind === "error") { $("composer").hidden = true; bubble("app", "ERROR", step.message); }
  else bubble("app", "SECOND VOICE", step.text);
}

async function send(text, askedToStop) {
  bubble("me", "YOU", text || (askedToStop ? "Please cancel it." : ""));
  $("answer").value = "";
  busy(true);
  try {
    await handle(await post("/api/say", { sessionId, text, askedToStop }));
  } catch (e) {
    bubble("app", "ERROR", e.message);
  } finally {
    busy(false);
  }
}

$("begin").addEventListener("click", async () => {
  const id = $("scenario").value;
  const s = meta.scenarios.find((x) => x.id === id);
  $("payerLine").textContent = s.payerName;
  $("amountLine").textContent = money(s.amount, s.currency);
  $("payeeLine").textContent = `to ${s.payeeName}`;
  if (s.callInProgress) {
    $("callbar").hidden = false;
    $("callText").textContent = "A call is in progress on this phone";
  }
  $("setup").hidden = true;
  $("payment").hidden = false;
  busy(true);
  try {
    const first = await post("/api/start", { scenarioId: id });
    sessionId = first.sessionId;
    await handle(first);
    $("composer").hidden = false;
    $("answer").focus();
  } catch (e) {
    bubble("app", "ERROR", e.message);
  } finally {
    busy(false);
  }
});

$("send").addEventListener("click", () => {
  const text = $("answer").value.trim();
  if (text) send(text, false);
});
$("answer").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("send").click();
});
$("cancel").addEventListener("click", () => send("Please cancel it.", true));

const res = await fetch("/api/scenarios");
meta = await res.json();
$("mode").textContent = meta.offline ? "offline stubs" : meta.model;
for (const s of meta.scenarios) {
  const o = document.createElement("option");
  o.value = s.id;
  o.textContent = `${s.payerName}, ${money(s.amount, s.currency)} to ${s.payeeName}`;
  $("scenario").append(o);
}
</script>
</body>
</html>
